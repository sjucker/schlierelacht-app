name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Exact version from environment.flutter, so a new stable release (new lints, new Dart) can't break an unchanged branch.
          flutter-version-file: pubspec.yaml
          cache: true

      # lib/firebase_options.dart is gitignored (generated by `flutterfire configure`).
      # A typed stub with the generated file's API lets analyze and tests compile.
      - name: Create stub firebase_options.dart
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => throw UnsupportedError('CI stub: run `flutterfire configure` for the real options.');
          }
          EOF

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format -o none --set-exit-if-changed lib test

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
